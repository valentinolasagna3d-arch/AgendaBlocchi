name: Build Calendar Schema Beta IPA
on:
  workflow_dispatch:

jobs:
  build-calendar-schema:
    runs-on: xcode-27
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Xcode 27 / iOS 27 SDK
        run: |
          set -euo pipefail
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          swift --version
          XCODE_VERSION="$(xcodebuild -version | awk '/^Xcode / {print $2}')"
          SDK_VERSION="$(xcrun --sdk iphoneos --show-sdk-version)"
          if [[ "$XCODE_VERSION" != 27.* || "$SDK_VERSION" != 27.* ]]; then
            echo "::error::La beta richiede Xcode 27 e iOS SDK 27. Selezionare Xcode 27 sul runner xcode-27."
            exit 1
          fi

      - name: Probe Calendar App Schema support
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/CalendarSchemaProbe.swift <<'SWIFT'
          import AppIntents

          @available(iOS 27.0, *)
          @AppEntity(schema: .calendar.calendar)
          struct CalendarSchemaProbeEntity {
              static let defaultQuery = Query()
              let id: String
              var title: String
              var displayRepresentation: DisplayRepresentation { "Probe" }

              init(id: String, title: String) {
                  self.id = id
                  self.title = title
              }

              struct Query: EntityQuery {
                  func entities(for identifiers: [CalendarSchemaProbeEntity.ID]) async throws -> [CalendarSchemaProbeEntity] {
                      identifiers.map { CalendarSchemaProbeEntity(id: $0, title: "Probe") }
                  }
              }
          }
          SWIFT

          if ! xcrun --sdk iphoneos swiftc -typecheck -target arm64-apple-ios27.0 /tmp/CalendarSchemaProbe.swift >/tmp/calendar-schema-probe.log 2>&1; then
            cat /tmp/calendar-schema-probe.log
            echo "::error::Il probe Calendar Schema non compila con l'SDK selezionato. Consultare gli errori Swift sopra. La beta resta obbligatoria: nessun fallback alla build normale."
            exit 1
          fi

          echo "Calendar App Schema disponibile: build beta abilitata."

      - name: Validate Swift with Calendar schema enabled
        run: |
          set -euo pipefail
          xcrun swiftc -frontend -parse -D CALENDAR_SCHEMA_BETA AgendaABlocchi/*.swift

      - name: Build unsigned iOS 27 Calendar Schema app
        run: |
          set -euo pipefail
          xcodebuild -project AgendaABlocchi.xcodeproj -scheme AgendaABlocchi -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath "$PWD/build-calendar-beta" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" IPHONEOS_DEPLOYMENT_TARGET=27.0 OTHER_SWIFT_FLAGS="-D CALENDAR_SCHEMA_BETA" build

      - name: Package SideStore IPA
        run: |
          set -euo pipefail
          APP="$PWD/build-calendar-beta/Build/Products/Release-iphoneos/AgendaABlocchi.app"
          test -f "$APP/Info.plist"
          rm -rf Payload AgendaABlocchi_v6_1_2_CalendarSchemaBeta_unsigned.ipa
          mkdir Payload
          cp -R "$APP" Payload/
          /usr/bin/zip -qry AgendaABlocchi_v6_1_2_CalendarSchemaBeta_unsigned.ipa Payload

      - name: Upload Calendar Schema Beta IPA
        uses: actions/upload-artifact@v4
        with:
          name: AgendaABlocchi-v6.1.2-CalendarSchemaBeta-build66-IPA
          path: AgendaABlocchi_v6_1_2_CalendarSchemaBeta_unsigned.ipa
