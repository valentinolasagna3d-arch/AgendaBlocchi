name: Build Agenda IPA
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: xcode-27
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode / SDK
        run: |
          set -euo pipefail
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          swift --version

      - name: Validate Swift and sync regression tests
        run: |
          set -euo pipefail
          xcrun swiftc -frontend -parse AgendaABlocchi/*.swift
          xcrun swiftc -target "$(uname -m)-apple-macosx14.0" -swift-version 5 -D SYNC_TESTING -parse-as-library AgendaABlocchi/Models.swift AgendaABlocchi/AgendaSync.swift Tests/SyncRegression.swift -o /tmp/agenda-sync-tests
          /tmp/agenda-sync-tests

      - name: Build unsigned iOS app
        run: |
          set -euo pipefail
          xcodebuild -project AgendaABlocchi.xcodeproj -scheme AgendaABlocchi -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath "$PWD/build" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build

      - name: Package SideStore IPA
        run: |
          set -euo pipefail
          APP="$PWD/build/Build/Products/Release-iphoneos/AgendaABlocchi.app"
          test -f "$APP/Info.plist"
          rm -rf Payload AgendaABlocchi_v6_1_1_unsigned.ipa
          mkdir Payload
          cp -R "$APP" Payload/
          /usr/bin/zip -qry AgendaABlocchi_v6_1_1_unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: AgendaABlocchi-v6.1.1-build65-IPA
          path: AgendaABlocchi_v6_1_1_unsigned.ipa
